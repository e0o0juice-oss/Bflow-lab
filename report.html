<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>만족도 시각화 생성기</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--pri:#111827;--soft:#eef2ff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif}
    .wrap{max-width:480px;margin:0 auto;padding:18px 14px 80px}.hero{padding:8px 2px 14px}.badge{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px}.hero h1{font-size:25px;line-height:1.2;margin:12px 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.05)}
    label{display:block;margin:10px 0 6px;font-weight:700;font-size:14px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;background:#fff}textarea{min-height:74px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 8px;font-weight:800;font-size:13px}.tab.on{background:var(--pri);color:white}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;background:var(--pri);color:white;border-radius:15px;padding:13px 10px;font-weight:900;font-size:15px}.btn.light{background:#fff;color:#111827;border:1px solid var(--line)}.chartBox{background:#fff;border:1px dashed #d1d5db;border-radius:20px;padding:12px;min-height:280px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:#f9fafb;border:1px solid var(--line);border-radius:18px;padding:14px}.kpi b{font-size:24px}.kpi span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.note{font-size:13px;color:var(--muted);line-height:1.55}.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.heat div{border-radius:14px;padding:14px 6px;text-align:center;color:#111827;font-weight:900}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.region{border-radius:18px;padding:15px 10px;text-align:center;font-weight:900;border:1px solid var(--line)}.region small{display:block;color:#4b5563;font-weight:700;margin-top:5px}.funnel{display:flex;flex-direction:column;align-items:center;gap:8px}.funnel div{color:white;text-align:center;border-radius:12px;padding:12px;font-weight:900}.info{display:grid;gap:10px}.infoRow{display:flex;align-items:center;gap:10px;background:#f9fafb;border:1px solid var(--line);padding:12px;border-radius:16px}.emoji{font-size:28px}.barMini{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;flex:1}.barMini i{display:block;height:100%;background:#111827}.mixTable{width:100%;border-collapse:collapse;font-size:13px}.mixTable th,.mixTable td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.mixBar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.mixBar i{display:block;height:100%;background:#111827}.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px}.footer .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}canvas{max-height:310px}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="badge">📊 사업계획서용 만족도 시각화</div>
      <h1>만족도 데이터를<br/>여러 그래프로 바꿔보기</h1>
      <p>숫자를 입력한 뒤 버튼을 누르면 히트맵, 지도형 그래프, 퍼널차트, KPI 대시보드, 막대그래프, 꺾은선그래프 등으로 바로 확인할 수 있습니다.</p>
    </section>

    <section class="card">
      <h2 style="margin:0 0 8px;font-size:18px">1. 만족도 데이터 입력</h2>
      <label>프로그램명</label><input id="program" value="고독사 예방 교육" />
      <div class="grid3">
        <div><label>매우만족</label><input id="v5" type="number" value="18" /></div>
        <div><label>만족</label><input id="v4" type="number" value="9" /></div>
        <div><label>보통</label><input id="v3" type="number" value="3" /></div>
      </div>
      <div class="grid2">
        <div><label>불만족</label><input id="v2" type="number" value="0" /></div>
        <div><label>매우불만족</label><input id="v1" type="number" value="0" /></div>
      </div>
      <div class="grid2">
        <div><label>사전 점수</label><input id="before" type="number" value="45" /></div>
        <div><label>사후 점수</label><input id="after" type="number" value="82" /></div>
      </div>
      <label>지역별 참여자 예시</label>
      <textarea id="regions">A동 12
B동 8
C동 6
D동 4</textarea>
      <p class="note">지역별 데이터는 “지역명 숫자” 형식으로 줄마다 입력하세요.</p>
    </section>

    <section class="card">
      <h2 style="margin:0 0 10px;font-size:18px">2. 보고 싶은 시각화 선택</h2>
      <div class="tabs" id="tabs"></div>
    </section>

    <section class="card">
      <h2 id="title" style="margin:0 0 10px;font-size:18px">KPI 대시보드</h2>
      <div id="output" class="chartBox"></div>
      <p id="caption" class="note"></p>
    </section>
  </div>

  <div class="footer"><div class="inner"><button class="btn" onclick="render()">그래프 새로고침</button><button class="btn light" onclick="copySummary()">요약문 복사</button></div></div>

<script>
const charts = [
  ['kpi','KPI 대시보드'],['bar','막대그래프'],['donut','도넛차트'],['line','꺾은선 그래프'],['stack','누적막대그래프'],['funnel','퍼널차트'],['heat','히트맵'],['map','지도형 그래프'],['info','인포그래픽'],['mix','표 + 그래프 혼합']
];
let current='kpi'; let chart=null;
const colors=['#111827','#374151','#6b7280','#9ca3af','#d1d5db'];
function el(id){return document.getElementById(id)}
function num(id){return Math.max(0, Number(el(id).value||0))}
function data(){
 const vals=[num('v5'),num('v4'),num('v3'),num('v2'),num('v1')]; const total=vals.reduce((a,b)=>a+b,0)||1;
 const score=((vals[0]*5+vals[1]*4+vals[2]*3+vals[3]*2+vals[4]*1)/total).toFixed(2);
 const positive=(((vals[0]+vals[1])/total)*100).toFixed(1);
 const before=num('before'), after=num('after'), improve=before?(((after-before)/before)*100).toFixed(1):0;
 const labels=['매우만족','만족','보통','불만족','매우불만족'];
 const regions=el('regions').value.split('\n').map(x=>x.trim()).filter(Boolean).map(row=>{const m=row.match(/(.+)\s+(\d+)$/);return m?{name:m[1],value:Number(m[2])}:{name:row,value:0}});
 return {vals,total,score,positive,before,after,improve,labels,regions,program:el('program').value||'프로그램'};
}
function initTabs(){el('tabs').innerHTML=charts.map(([id,name])=>`<button class="tab ${id===current?'on':''}" onclick="current='${id}';initTabs();render()">${name}</button>`).join('')}
function clear(){ if(chart){chart.destroy();chart=null} el('output').innerHTML=''}
function canvas(){el('output').innerHTML='<canvas id="cv"></canvas>';return el('cv')}
function render(){clear(); const d=data(); const name=charts.find(x=>x[0]===current)[1]; el('title').textContent=name; el('caption').textContent=caption(d,current);
 if(current==='kpi') return kpi(d); if(current==='bar') return bar(d); if(current==='donut') return donut(d); if(current==='line') return line(d); if(current==='stack') return stack(d); if(current==='funnel') return funnel(d); if(current==='heat') return heat(d); if(current==='map') return map(d); if(current==='info') return info(d); if(current==='mix') return mix(d);
}
function kpi(d){el('output').innerHTML=`<div class="kpis"><div class="kpi"><b>${d.total}명</b><span>응답자 수</span></div><div class="kpi"><b>${d.score}</b><span>5점 평균</span></div><div class="kpi"><b>${d.positive}%</b><span>긍정 응답률</span></div><div class="kpi"><b>${d.improve}%</b><span>사전·사후 향상률</span></div></div>`}
function bar(d){chart=new Chart(canvas(),{type:'bar',data:{labels:d.labels,datasets:[{label:'응답 수',data:d.vals,backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{display:false}}}})}
function donut(d){chart=new Chart(canvas(),{type:'doughnut',data:{labels:d.labels,datasets:[{data:d.vals,backgroundColor:colors}]},options:{responsive:true}})}
function line(d){chart=new Chart(canvas(),{type:'line',data:{labels:['사전','사후'],datasets:[{label:'점수 변화',data:[d.before,d.after],borderColor:'#111827',backgroundColor:'#111827',tension:.25}]},options:{responsive:true,scales:{y:{beginAtZero:true,max:100}}}})}
function stack(d){chart=new Chart(canvas(),{type:'bar',data:{labels:[d.program],datasets:d.labels.map((l,i)=>({label:l,data:[d.vals[i]],backgroundColor:colors[i]}))},options:{responsive:true,indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true}}}})}
function funnel(d){const max=Math.max(...d.vals,1);el('output').innerHTML=`<div class="funnel">${d.labels.map((l,i)=>`<div style="width:${Math.max(28,d.vals[i]/max*100)}%;background:${colors[i]}">${l} ${d.vals[i]}명</div>`).join('')}</div>`}
function heat(d){const max=Math.max(...d.vals,1);el('output').innerHTML=`<div class="heat">${d.labels.map((l,i)=>{const op=.18+(d.vals[i]/max*.72);return `<div style="background:rgba(17,24,39,${op})"><small>${l}</small><br>${d.vals[i]}명</div>`}).join('')}</div>`}
function map(d){const max=Math.max(...d.regions.map(r=>r.value),1);el('output').innerHTML=`<div class="map">${d.regions.map((r,i)=>{const op=.15+(r.value/max*.75);return `<div class="region" style="background:rgba(17,24,39,${op})">${r.name}<small>${r.value}명</small></div>`}).join('')}</div><p class="note">실제 지도가 아니라 사업계획서용 ‘지역 분포 지도형 카드’입니다.</p>`}
function info(d){el('output').innerHTML=`<div class="info"><div class="infoRow"><div class="emoji">😊</div><div><b>긍정 응답률 ${d.positive}%</b><div class="note">매우만족+만족 기준</div></div></div><div class="infoRow"><div class="emoji">📈</div><div><b>사전 ${d.before}점 → 사후 ${d.after}점</b><div class="note">향상률 ${d.improve}%</div></div></div><div class="infoRow"><div class="emoji">⭐</div><div style="flex:1"><b>평균 만족도 ${d.score}/5점</b><div class="barMini"><i style="width:${d.score/5*100}%"></i></div></div></div></div>`}
function mix(d){el('output').innerHTML=`<table class="mixTable"><thead><tr><th>항목</th><th>응답</th><th>비율</th></tr></thead><tbody>${d.labels.map((l,i)=>{const p=(d.vals[i]/d.total*100).toFixed(1);return `<tr><td>${l}</td><td>${d.vals[i]}명</td><td><div>${p}%</div><div class="mixBar"><i style="width:${p}%"></i></div></td></tr>`}).join('')}</tbody></table>`}
function caption(d,type){ const base=`${d.program} 만족도 조사 결과, 총 ${d.total}명이 응답했으며 평균 만족도는 ${d.score}점, 긍정 응답률은 ${d.positive}%입니다.`; const extra={kpi:'핵심 성과를 한눈에 보여주는 사업계획서·결과보고서 첫 페이지용입니다.',bar:'응답 분포를 가장 직관적으로 보여줄 때 적합합니다.',donut:'전체 응답 중 각 만족도 항목의 비중을 보여줄 때 적합합니다.',line:'사전·사후 변화나 교육 효과를 강조할 때 적합합니다.',stack:'만족도 구성을 한 줄로 압축해 보여줄 때 적합합니다.',funnel:'참여자 반응이 단계적으로 줄어드는 느낌을 설명할 때 활용할 수 있습니다.',heat:'만족도 강도를 색의 진하기로 보여줄 때 적합합니다.',map:'지역별 참여자 분포를 사업계획서에 간단히 표현할 때 적합합니다.',info:'숫자를 카드뉴스처럼 쉽게 설명할 때 적합합니다.',mix:'표의 정확성과 그래프의 직관성을 함께 보여줄 때 적합합니다.'}; return base+' '+extra[type];}
async function copySummary(){await navigator.clipboard.writeText(caption(data(),current)); alert('요약문이 복사되었습니다.');}
initTabs(); render();
</script>
</body>
</html>
